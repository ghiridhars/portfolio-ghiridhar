<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Doto:wght@700&amp;display=swap');
    text {
      font-family: 'Doto', sans-serif;
      font-weight: 700;
    }
    @media (prefers-color-scheme: light) {
      rect { fill: #ffffff; }
      text { fill: #000000; }
    }
    @media (prefers-color-scheme: dark) {
      rect { fill: #000000; }
      text { fill: #ffffff; }
    }
  </style>
  <rect width="32" height="32" fill="#000000"/>
  <text x="16" y="23" text-anchor="middle" font-size="16" fill="#ffffff">GS</text>
</svg>
